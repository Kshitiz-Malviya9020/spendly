{% extends "base.html" %}

{% block title %}Add Expense - Spendly{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>Add New Expense</h1>
        <p class="subtitle">Keep track of your spending</p>

        <form action="{{ url_for('add_expense') }}" method="POST">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                       value="{{ amount if amount else '' }}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled {{ 'selected' if not category }}>Select a category</option>
                    {% for cat in ["Food", "Transport", "Bills", "Health", "Entertainment", "Shopping", "Other"] %}
                        <option value="{{ cat }}" {{ 'selected' if category == cat }}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date"
                       value="{{ date if date else '' }}" required>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" name="description" maxlength="200"
                       value="{{ description if description else '' }}" placeholder="What was this for?">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Expense</button>
                <a href="{{ url_for('profile') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
    }
    .form-container h1 {
        text-align: center;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }
    .form-container .subtitle {
        text-align: center;
        margin-bottom: 2rem;
        color: var(--text-muted);
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--text-main);
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--bg-input);
        color: var(--text-main);
        font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px var(--primary-color-light);
    }
    .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 2rem;
    }
    .btn-primary {
        padding: 0.75rem 1.5rem;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
    }
    .btn-primary:hover {
        background: var(--primary-color-dark);
    }
    .btn-secondary {
        padding: 0.75rem 1.5rem;
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        font-weight: 600;
        transition: background 0.2s;
    }
    .btn-secondary:hover {
        background: var(--bg-muted);
    }
</style>
{% endblock %}
